<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Compass</title>
    <style>
        :root {
            --bg-color: #121212;
            --accent-color: #ff3b30;
            --text-color: #ffffff;
            --dial-color: #2c2c2e;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #heading-container {
            text-align: center;
            margin-bottom: 20px;
        }

        #degrees {
            font-size: 4rem;
            font-weight: bold;
            margin: 0;
        }

        #direction {
            font-size: 1.5rem;
            color: var(--accent-color);
            font-weight: 600;
            margin: 5px 0 0 0;
        }

        #compass-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Fixed pointer indicating "Forward" */
        #pointer {
            position: absolute;
            top: -10px;
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 25px solid var(--accent-color);
            z-index: 10;
        }

        #compass-dial {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: var(--dial-color);
            border: 4px solid var(--text-color);
            position: relative;
            transition: transform 0.1s ease-out;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Cardinal direction labels inside the dial */
        .label {
            position: absolute;
            font-weight: bold;
            font-size: 1.2rem;
            transform: translate(-50%, -50%);
        }

        .label-n { top: 12%; left: 50%; color: var(--accent-color); }
        .label-e { top: 50%; right: 5%; transform: translate(0, -50%); }
        .label-s { bottom: 12%; left: 50%; }
        .label-w { top: 50%; left: 5%; transform: translate(0, -50%); }

        /* Status message for troubleshooting */
        #status {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #8e8e93;
            text-align: center;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <div id="heading-container">
        <p id="degrees">0°</p>
        <p id="direction">N</p>
    </div>

    <div id="compass-container">
        <div id="pointer"></div>
        <div id="compass-dial">
            <div class="label label-n">N</div>
            <div class="label label-e">E</div>
            <div class="label label-s">S</div>
            <div class="label label-w">W</div>
        </div>
    </div>

    <p id="status">Calibrating sensors...</p>

    <script>
        const dial = document.getElementById('compass-dial');
        const degreesText = document.getElementById('degrees');
        const directionText = document.getElementById('direction');
        const statusText = document.getElementById('status');

        // Convert degrees to cardinal directions
        function getCardinal(deg) {
            const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            const index = Math.round(deg / 45) % 8;
            return directions[index];
        }

        function handleOrientation(event) {
            let heading = null;

            // Android-specific property for absolute orientation
            if (event.webkitCompassHeading) {
                heading = event.webkitCompassHeading; 
            } else if (event.absolute === true || event.absolute === undefined) {
                // alpha is 0 when pointing north on standard absolute orientation
                if (event.alpha !== null) {
                    heading = 360 - event.alpha; 
                }
            }

            if (heading !== null) {
                const roundedHeading = Math.round(heading);
                
                // Rotate the dial counter to the heading so North stays North
                dial.style.transform = `rotate(${-roundedHeading}deg)`;
                
                degreesText.innerText = `${roundedHeading}°`;
                directionText.innerText = getCardinal(roundedHeading);
                statusText.innerText = "Compass active.";
            } else {
                statusText.innerText = "Error: Orientation data not absolute. Try checking your device location/GPS settings.";
            }
        }

        // Listen for the absolute device orientation event (ideal for Android)
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            // Fallback to standard orientation if absolute isn't supported
            window.addEventListener('deviceorientation', handleOrientation, true);
        } else {
            statusText.innerText = "Your browser or device does not support orientation sensors.";
        }
    </script>
</body>
</html>
