<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Growth & Klar Yield Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 400: '#34d399',
                            500: '#10b981', 600: '#059669', 700: '#047857', 900: '#064e3b', accent: '#00e676'
                        },
                        darkbg: '#0b0f17',
                        darkcard: '#131b2e',
                        darkborder: '#1f293d'
                    }
                }
            }
        }
    </script>
    <style>
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        .glass-panel { background: rgba(19, 27, 46, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .accent-gradient-text {
            background: linear-gradient(135deg, #10b981 0%, #34d399 50%, #a7f3d0 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hidden { display: none !important; }
        .ctrl-grid, .cards4, .two-col, .klar-layout, .kpi-grid { display: grid; grid-template-columns: minmax(0, 1fr); }
        .ctrl-grid, .cards4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .kpi-item { border-top: 1px solid #1f293d; padding-top: 1rem; }
        .kpi-item:first-child { border-top: 0; padding-top: 0; }
        #panes { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
        @media (min-width: 640px) { body.single .two-col { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (min-width: 768px) {
            body.single .klar-layout { grid-template-columns: 5fr 7fr; }
            body.single .kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            body.single .kpi-item { border-top: 0; padding-top: 0; border-left: 1px solid #1f293d; padding-left: 1.5rem; }
            body.single .kpi-item:first-child { border-left: 0; padding-left: 0; }
        }
        @media (min-width: 1024px) {
            body.single .ctrl-grid, body.single .cards4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
            body.split #panes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        body.split main { max-width: 1800px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased selection:bg-emerald-500 selection:text-white">

    <header class="bg-slate-950 border-b border-slate-800 sticky top-0 z-30 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-600 text-white p-2.5 rounded-xl shadow-md">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-white">Compound Growth</h1>
            </div>

            <div id="headerTabs" class="flex items-center bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs sm:text-sm font-medium overflow-x-auto max-w-full"></div>

            <div class="flex items-center bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs sm:text-sm font-medium" title="Choose how many calculators to show">
                <button type="button" id="layoutSingle" class="px-3 py-2 rounded-lg transition-all whitespace-nowrap">Single</button>
                <button type="button" id="layoutSplit" class="px-3 py-2 rounded-lg transition-all whitespace-nowrap">Side by Side</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div id="panes"></div>
    </main>

    <template id="tplStd">
        <!-- ORIGINAL TOOL CONTAINER VIEW -->
        <div data-r="standardToolView" class="space-y-8">
            <!-- Control Panel -->
            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-xl ctrl-grid gap-6">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Initial Investment ($)</label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 font-semibold">$</div>
                        <input type="number" data-r="initialInvestment" value="1000" min="1" step="100" class="block w-full pl-8 pr-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
                    </div>
                    <div data-r="stepBtns" class="hidden grid grid-cols-6 gap-1.5 mt-2">
                        <button type="button" data-step="-1" data-target="initialInvestment" class="px-2 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-300 hover:text-white hover:border-emerald-500 transition">&minus;1</button>
                        <button type="button" data-step="-10" data-target="initialInvestment" class="px-2 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-300 hover:text-white hover:border-emerald-500 transition">&minus;10</button>
                        <button type="button" data-step="1" data-target="initialInvestment" class="px-2 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-300 hover:text-white hover:border-emerald-500 transition">+1</button>
                        <button type="button" data-step="10" data-target="initialInvestment" class="px-2 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-300 hover:text-white hover:border-emerald-500 transition">+10</button>
                        <button type="button" data-step="50" data-target="initialInvestment" class="px-2 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-300 hover:text-white hover:border-emerald-500 transition">+50</button>
                        <button type="button" data-step="100" data-target="initialInvestment" class="px-2 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-300 hover:text-white hover:border-emerald-500 transition">+100</button>
                    </div>
                </div>

                <div>
                    <label data-r="rateLabel" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Annual Interest Rate (%)</label>
                    <div class="relative rounded-xl shadow-sm">
                        <input type="number" data-r="annualRate" value="3.0" min="0.01" step="0.1" class="block w-full pl-4 pr-10 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
                        <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-500 font-semibold">%</div>
                    </div>
                </div>

                <div data-r="recurringAmountContainer" class="hidden">
                    <label data-r="recurringAmountLabel" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Recurring Add ($)</label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 font-semibold">$</div>
                        <input type="number" data-r="recurringAmount" value="50" min="0" step="10" class="block w-full pl-8 pr-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
                    </div>
                    <div data-r="stepBtnsAmt" class="hidden grid grid-cols-6 gap-1.5 mt-2">
                        <button type="button" data-step="-1" data-target="recurringAmount" class="px-2 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-300 hover:text-white hover:border-emerald-500 transition">&minus;1</button>
                        <button type="button" data-step="-10" data-target="recurringAmount" class="px-2 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-300 hover:text-white hover:border-emerald-500 transition">&minus;10</button>
                        <button type="button" data-step="1" data-target="recurringAmount" class="px-2 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-300 hover:text-white hover:border-emerald-500 transition">+1</button>
                        <button type="button" data-step="10" data-target="recurringAmount" class="px-2 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-300 hover:text-white hover:border-emerald-500 transition">+10</button>
                        <button type="button" data-step="50" data-target="recurringAmount" class="px-2 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-300 hover:text-white hover:border-emerald-500 transition">+50</button>
                        <button type="button" data-step="100" data-target="recurringAmount" class="px-2 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-300 hover:text-white hover:border-emerald-500 transition">+100</button>
                    </div>
                </div>

                <div data-r="recurringDaysContainer" class="hidden">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Frequency (Every X Days)</label>
                    <input type="number" data-r="recurringDays" value="30" min="1" max="365" step="1" class="block w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
                </div>
            </div>

            <!-- Withdrawal Summary (only visible on Recurring Withdrawal tab) -->
            <div data-r="withdrawalSummary" class="hidden cards4 gap-4">
                <div class="bg-slate-950 border border-slate-800 rounded-2xl p-5 shadow-xl">
                    <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Withdrawn</div>
                    <div class="text-2xl font-extrabold text-amber-400 mt-1" data-r="wdTotalWithdrawn">$0.00</div>
                    <div class="text-xs text-slate-500 mt-1" data-r="wdCountNote">0 withdrawals</div>
                </div>
                <div class="bg-slate-950 border border-slate-800 rounded-2xl p-5 shadow-xl">
                    <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Interest Earned</div>
                    <div class="text-2xl font-extrabold text-emerald-400 mt-1" data-r="wdTotalInterest">$0.00</div>
                    <div class="text-xs text-slate-500 mt-1">Over 365 days</div>
                </div>
                <div class="bg-slate-950 border border-slate-800 rounded-2xl p-5 shadow-xl">
                    <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Ending Balance</div>
                    <div class="text-2xl font-extrabold text-white mt-1" data-r="wdEndBalance">$0.00</div>
                    <div class="text-xs text-slate-500 mt-1" data-r="wdNetNote">vs. initial investment</div>
                </div>
                <div class="bg-slate-950 border border-slate-800 rounded-2xl p-5 shadow-xl">
                    <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Sustainability</div>
                    <div class="text-lg font-bold text-white mt-1" data-r="wdStatus">—</div>
                    <div class="text-xs text-slate-500 mt-1" data-r="wdStatusNote"></div>
                </div>
            </div>

            <!-- Milestone Progress Breakdown -->
            <div class="space-y-4" data-r="milestoneSection">
                <h2 class="text-lg font-bold text-white tracking-tight">Milestone Progress Breakdown</h2>
                <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-slate-900/90 text-xs font-semibold uppercase text-slate-400 tracking-wider border-b border-slate-800">
                                <tr>
                                    <th class="py-3.5 px-6">Milestone Timeframe</th>
                                    <th class="py-3.5 px-6">Day Count</th>
                                    <th class="py-3.5 px-6">Compounded Interest ($)</th>
                                    <th class="py-3.5 px-6">Total Balance ($)</th>
                                </tr>
                            </thead>
                            <tbody data-r="textMilestonesBody" class="divide-y divide-slate-800/60 text-sm text-slate-300"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Day-by-Day Ledger Section -->
            <div class="bg-slate-950 border border-slate-800 rounded-2xl shadow-xl overflow-hidden">
                <div class="p-6 border-b border-slate-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                        <h2 class="text-lg font-bold text-white tracking-tight">Day-by-Day Growth Ledger</h2>
                        <p class="text-xs text-slate-400 mt-0.5">Complete schedule tracking daily accrued interest and updated compounded balance.</p>
                    </div>
                    <div class="text-xs bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800 text-emerald-400 font-medium" data-r="scheduleDurationLabel">
                        Duration: 365 Days
                    </div>
                </div>
                <div class="overflow-x-auto max-h-[500px]">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-900/90 sticky top-0 z-10 text-xs font-semibold uppercase text-slate-400 tracking-wider border-b border-slate-800">
                            <tr>
                                <th class="py-3.5 px-6">Day</th>
                                <th class="py-3.5 px-6">Compounded Interest</th>
                                <th class="py-3.5 px-6">Compounded Balance</th>
                                <th class="py-3.5 px-6">That Day's Interest</th>
                                <th class="py-3.5 px-6 hidden" data-r="withdrawnHeader">Withdrawn That Day</th>
                            </tr>
                        </thead>
                        <tbody data-r="ledgerTableBody" class="divide-y divide-slate-800/60 text-sm text-slate-300"></tbody>
                    </table>
                </div>
            </div>

            <!-- Growth Trajectory Curve Section -->
            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-800 pb-4">
                    <div>
                        <h2 class="text-lg font-bold text-white tracking-tight">Growth Trajectory Visualization</h2>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="inline-block w-3 h-3 rounded-full bg-emerald-500"></span>
                        <span class="text-xs text-slate-400 font-medium">Compounded Balance ($)</span>
                    </div>
                </div>
                <div class="w-full h-80">
                    <canvas data-r="growthChart"></canvas>
                </div>
            </div>
        </div>

        
    </template>

    <template id="tplKlar">
        <!-- KLAR FLEXIBLE MAX YIELD CALCULATOR VIEW -->
        <div data-r="klarFlexView" class="hidden space-y-8">

            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between bg-darkcard/80 p-4 rounded-2xl border border-darkborder gap-3">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-brand-400 flex items-center justify-center shadow-lg shadow-brand-500/20">
                        <i data-lucide="trending-up" class="w-6 h-6 text-white"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-lg leading-tight flex items-center gap-2">
                            Klar Yield Calculator
                            <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-brand-500/10 text-brand-400 border border-brand-500/20">Platino Tier</span>
                        </h2>
                        <p class="text-xs text-slate-400">Inversión Flexible Max & Overflow Yield Simulator</p>
                    </div>
                </div>
                <div class="flex items-center gap-2 text-xs text-slate-400 bg-darkbg px-3 py-1.5 rounded-lg border border-darkborder">
                    <i data-lucide="shield-check" class="w-4 h-4 text-brand-400"></i>
                    <span>Tier 1 Cap: <strong>$25,000.00 MXN</strong> @ 15.0% APY</span>
                </div>
            </div>

            <section class="glass-panel rounded-2xl p-6 relative overflow-hidden border border-brand-500/20">
                <div class="absolute -right-16 -top-16 w-64 h-64 bg-brand-500/10 rounded-full blur-3xl pointer-events-none"></div>
                <div class="kpi-grid gap-6 relative z-10">
                    <div class="space-y-1 kpi-item">
                        <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Projected Final Balance</span>
                        <div class="text-3xl sm:text-4xl font-extrabold accent-gradient-text" data-r="kpiFinalBalance">$0.00</div>
                        <span class="text-xs text-slate-400 flex items-center gap-1 pt-1" data-r="kpiPrincipalNote">
                            <i data-lucide="wallet" class="w-3.5 h-3.5"></i> Initial: $25,000.00 MXN
                        </span>
                    </div>
                    <div class="space-y-1 kpi-item">
                        <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Total Interest Earned</span>
                        <div class="text-3xl sm:text-4xl font-extrabold text-brand-400" data-r="kpiTotalInterest">$0.00</div>
                        <span class="text-xs text-emerald-400/90 flex items-center gap-1 pt-1" data-r="kpiPercentReturn">
                            <i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i> +0.00% return
                        </span>
                    </div>
                    <div class="space-y-1 kpi-item">
                        <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Blended Effective APY</span>
                        <div class="text-3xl sm:text-4xl font-extrabold text-slate-100" data-r="kpiEffectiveApy">0.00%</div>
                        <span class="text-xs text-slate-400 flex items-center gap-1 pt-1" data-r="kpiApySubtext">
                            <i data-lucide="percent" class="w-3.5 h-3.5"></i> Weighted return on entire sum
                        </span>
                    </div>
                </div>
            </section>

            <div class="klar-layout gap-8">

                <div class="min-w-0 space-y-6">
                    <div class="glass-panel rounded-2xl p-6 space-y-6">
                        <div class="flex items-center justify-between border-b border-darkborder pb-4">
                            <h2 class="font-semibold text-lg flex items-center gap-2">
                                <i data-lucide="sliders" class="w-5 h-5 text-brand-400"></i>
                                Parameters
                            </h2>
                            <button data-r="resetBtn" class="text-xs text-slate-400 hover:text-white transition flex items-center gap-1">
                                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset
                            </button>
                        </div>

                        <div class="space-y-2">
                            <div class="flex justify-between items-center text-sm">
                                <label class="font-medium text-slate-200">Total Investment Amount</label>
                                <span class="text-xs text-brand-400 font-semibold" data-r="tierSplitBadge">100% in Tier 1</span>
                            </div>
                            <div class="relative">
                                <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 font-medium">$</span>
                                <input type="number" data-r="initialBalance" value="25000" min="100" step="500"
                                    class="w-full pl-8 pr-16 py-2.5 bg-darkbg border border-darkborder rounded-xl text-white font-semibold focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition">
                                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-400 font-semibold">MXN</span>
                            </div>
                            <input type="range" data-r="initialBalanceSlider" min="1000" max="100000" step="1000" value="25000"
                                class="w-full accent-brand-500 bg-darkbg h-1.5 rounded-lg appearance-none cursor-pointer">
                        </div>

                        <div class="space-y-2">
                            <label class="font-medium text-sm text-slate-200">Time Horizon</label>
                            <div class="grid grid-cols-7 gap-2">
                                <input type="number" data-r="timeDuration" value="12" min="1" max="365"
                                    class="col-span-3 px-3 py-2.5 bg-darkbg border border-darkborder rounded-xl text-white font-semibold focus:outline-none focus:border-brand-500 transition">
                                <select data-r="timeUnit"
                                    class="col-span-4 px-3 py-2.5 bg-darkbg border border-darkborder rounded-xl text-white font-medium focus:outline-none focus:border-brand-500 transition cursor-pointer">
                                    <option value="days">Days</option>
                                    <option value="weeks">Weeks</option>
                                    <option value="months" selected>Months</option>
                                    <option value="years">Years</option>
                                </select>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="font-medium text-sm text-slate-200 flex items-center justify-between">
                                <span>Payout & Compounding</span>
                                <i data-lucide="info" class="w-4 h-4 text-slate-400" title="Klar credits Flexible yields every Monday."></i>
                            </label>
                            <div class="grid grid-cols-2 gap-2 p-1 bg-darkbg rounded-xl border border-darkborder">
                                <button type="button" data-r="compoundWeeklyBtn" class="py-2 text-xs font-semibold rounded-lg bg-brand-600 text-white shadow transition">
                                    Weekly Reinvest
                                </button>
                                <button type="button" data-r="compoundSimpleBtn" class="py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition">
                                    Simple Interest
                                </button>
                            </div>
                        </div>

                        <div class="border-t border-darkborder pt-4">
                            <button data-r="toggleRatesBtn" class="w-full flex justify-between items-center text-xs font-semibold text-slate-400 hover:text-slate-200">
                                <span class="flex items-center gap-1.5">
                                    <i data-lucide="settings-2" class="w-4 h-4 text-brand-400"></i> Custom Yield Rates (Advanced)
                                </span>
                                <i data-lucide="chevron-down" data-r="ratesChevron" class="w-4 h-4 transition-transform duration-200"></i>
                            </button>

                            <div data-r="ratesPanel" class="hidden space-y-4 pt-4">
                                <div class="space-y-1">
                                    <div class="flex justify-between text-xs text-slate-300">
                                        <span>Tier 1 Rate (&le; $25,000 MXN)</span>
                                        <span class="font-semibold text-brand-400" data-r="tier1RateDisplay">15.0% APY</span>
                                    </div>
                                    <div class="relative">
                                        <input type="number" data-r="tier1Rate" value="15.0" step="0.1" min="0" max="30"
                                            class="w-full pl-3 pr-8 py-2 bg-darkbg border border-darkborder rounded-lg text-xs text-white focus:outline-none focus:border-brand-500">

    <script>
        const TABS = [
            { id: 'monthly', label: 'Monthly Compound' },
            { id: 'recurring', label: 'Recurring Contribution' },
            { id: 'withdrawal', label: 'Recurring Withdrawal' },
            { sep: true },
            { id: 'yearly', label: 'Yearly Compound' },
            { sep: true },
            { id: 'klar_flex', label: 'KLAR Flex APY' }
        ];
        const TAB_ON = "px-3 sm:px-4 py-2 rounded-lg transition-all duration-200 bg-emerald-600 text-white shadow whitespace-nowrap";
        const TAB_OFF = "px-3 sm:px-4 py-2 rounded-lg transition-all duration-200 text-slate-400 hover:text-white whitespace-nowrap";
        const TIER_1_CAP = 25000;

        const fmtUSD = v => '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const fmtMXN = amount => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount);

        class Pane {
            constructor(label, defaultTab, headerTabsEl) {
                this.label = label;
                this.tab = defaultTab;
                this.chart = null;
                this.weekly = true;

                this.root = document.createElement('section');
                this.root.className = 'min-w-0 space-y-6';
                this.root.innerHTML = '<div data-r="paneTabs" class="flex flex-wrap items-center gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-medium"></div>';
                this.root.appendChild(document.getElementById('tplStd').content.cloneNode(true));
                this.root.appendChild(document.getElementById('tplKlar').content.cloneNode(true));

                this.el = {};
                this.root.querySelectorAll('[data-r]').forEach(e => { this.el[e.dataset.r] = e; });
                this.tabBars = headerTabsEl ? [headerTabsEl, this.el.paneTabs] : [this.el.paneTabs];
                this.bind();
            }

            renderTabs() {
                this.tabBars.forEach(bar => {
                    bar.innerHTML = '';
                    if (bar === this.el.paneTabs) {
                        const chip = document.createElement('span');
                        chip.className = 'px-2.5 py-1.5 rounded-md bg-slate-800 text-emerald-400 font-bold';
                        chip.textContent = 'View ' + this.label;
                        bar.appendChild(chip);
                    }
                    TABS.forEach(t => {
                        if (t.sep) {
                            const s = document.createElement('span');
                            s.className = 'px-2 text-slate-600 font-bold select-none';
                            s.textContent = '/';
                            bar.appendChild(s);
                            return;
                        }
                        const b = document.createElement('button');
                        b.type = 'button';
                        b.textContent = t.label;
                        b.className = t.id === this.tab ? TAB_ON : TAB_OFF;
                        b.addEventListener('click', () => this.setTab(t.id));
                        bar.appendChild(b);
                    });
                });
            }

            setTab(tab) {
                this.tab = tab;
                this.renderTabs();
                const e = this.el;

                if (tab === 'klar_flex') {
                    e.standardToolView.classList.add('hidden');
                    e.klarFlexView.classList.remove('hidden');
                    this.calculateYields();
                    return;
                }
                e.standardToolView.classList.remove('hidden');
                e.klarFlexView.classList.add('hidden');

                const isRecurringType = (tab === 'recurring' || tab === 'withdrawal');
                e.recurringAmountContainer.classList.toggle('hidden', !isRecurringType);
                e.recurringDaysContainer.classList.toggle('hidden', !isRecurringType);
                e.recurringAmountLabel.innerText = tab === 'withdrawal' ? 'Recurring Withdrawal ($)' : 'Recurring Add ($)';

                e.withdrawalSummary.classList.toggle('hidden', tab !== 'withdrawal');
                e.withdrawnHeader.classList.toggle('hidden', tab !== 'withdrawal');
                e.stepBtns.classList.toggle('hidden', tab !== 'withdrawal');
                e.stepBtnsAmt.classList.toggle('hidden', tab !== 'withdrawal');

                e.rateLabel.innerText = (tab === 'monthly' || isRecurringType) ? 'Monthly Interest Rate (%)' : 'Annual Interest Rate (%)';
                this.calculate();
            }

            // ---------- Standard calculators ----------
            calculate() {
                const e = this.el;
                const initialInvestment = parseFloat(e.initialInvestment.value) || 1000;
                const rateInput = parseFloat(e.annualRate.value) || 3.0;
                const recurringAmount = parseFloat(e.recurringAmount.value) || 0;
                const recurringDays = parseInt(e.recurringDays.value) || 30;
                const tab = this.tab;
                const totalDays = 365;

                e.scheduleDurationLabel.innerText = `Duration: ${totalDays} Days`;

                const monthlyType = (tab === 'monthly' || tab === 'recurring' || tab === 'withdrawal');
                const dailyRate = monthlyType ? ((rateInput / 100) * 12) / 365 : (rateInput / 100) / 365;

                let balance = initialInvestment, totalInterest = 0, totalWithdrawn = 0, withdrawalCount = 0, depletedDay = null;
                const ledger = [], chartLabels = [], chartData = [];

                for (let day = 1; day <= totalDays; day++) {
                    let withdrawnToday = 0;

                    if (tab === 'recurring' && recurringDays > 0 && day % recurringDays === 0) {
                        balance += recurringAmount;
                    }
                    if (tab === 'withdrawal' && recurringDays > 0 && day % recurringDays === 0 && balance > 0) {
                        withdrawnToday = Math.min(recurringAmount, balance);
                        balance -= withdrawnToday;
                        totalWithdrawn += withdrawnToday;
                        if (withdrawnToday > 0) withdrawalCount++;
                        if (balance <= 0.005 && depletedDay === null) { balance = 0; depletedDay = day; }
                    }

                    const startBalance = balance;
                    const cumulativeBeforeToday = totalInterest;
                    const dayInterest = balance * dailyRate;
                    totalInterest += dayInterest;
                    balance += dayInterest;

                    ledger.push({ day, dailyInterest: dayInterest, totalInterest: cumulativeBeforeToday, balance: startBalance, withdrawn: withdrawnToday });

                    if (tab === 'recurring' || tab === 'withdrawal') {
                        if (day % 15 === 0 || day === totalDays) { chartLabels.push(`Day ${day}`); chartData.push(balance); }
                    } else if (totalDays <= 31 || day % Math.ceil(totalDays / 30) === 0 || day === totalDays) {
                        chartLabels.push(`Day ${day}`); chartData.push(balance);
                    }
                }

                if (tab === 'withdrawal') {
                    this.renderWithdrawalSummary({ initialInvestment, totalWithdrawn, withdrawalCount, totalInterest, endBalance: balance, depletedDay });
                }
                this.renderMilestones(ledger, totalDays, totalInterest, balance);
                this.renderTable(ledger);
                this.renderChart(chartLabels, chartData);
                alignPanes();
            }

            renderWithdrawalSummary(s) {
                const e = this.el;
                e.wdTotalWithdrawn.innerText = fmtUSD(s.totalWithdrawn);
                e.wdCountNote.innerText = `${s.withdrawalCount} withdrawal${s.withdrawalCount === 1 ? '' : 's'}`;
                e.wdTotalInterest.innerText = fmtUSD(s.totalInterest);
                e.wdEndBalance.innerText = fmtUSD(s.endBalance);

                const diff = s.endBalance - s.initialInvestment;
                e.wdNetNote.innerText = `${diff >= 0 ? '+' : '-'}${fmtUSD(Math.abs(diff))} vs. initial investment`;
                e.wdNetNote.className = 'text-xs mt-1 ' + (diff >= 0 ? 'text-emerald-400' : 'text-amber-400');

                if (s.depletedDay !== null) {
                    e.wdStatus.innerText = 'Depleted';
                    e.wdStatus.className = 'text-lg font-bold text-red-400 mt-1';
                    e.wdStatusNote.innerText = `Balance runs out on day ${s.depletedDay}`;
                } else if (diff >= 0) {
                    e.wdStatus.innerText = 'Sustainable';
                    e.wdStatus.className = 'text-lg font-bold text-emerald-400 mt-1';
                    e.wdStatusNote.innerText = 'Interest covers your withdrawals';
                } else {
                    e.wdStatus.innerText = 'Drawing down';
                    e.wdStatus.className = 'text-lg font-bold text-amber-400 mt-1';
                    e.wdStatusNote.innerText = 'Principal shrinks but lasts the year';
                }
            }

            renderMilestones(ledger, totalDays, finalTotalInterest, finalBalance) {
                const milestones = [
                    { label: '1 Week', day: 7 },
                    { label: '1 Month (~30 days)', day: 30 },
                    { label: '1 Quarter (90 days)', day: Math.min(90, totalDays) },
                    { label: 'Half Year (180 days)', day: Math.min(180, totalDays) },
                    { label: `Full Year (${totalDays} days)`, day: totalDays }
                ];
                const tbody = this.el.textMilestonesBody;
                tbody.innerHTML = '';
                milestones.forEach(m => {
                    let interestAt, balanceAt;
                    if (m.day >= totalDays) { interestAt = finalTotalInterest; balanceAt = finalBalance; }
                    else {
                        const item = ledger.find(l => l.day === m.day + 1);
                        interestAt = item ? item.totalInterest : finalTotalInterest;
                        balanceAt = item ? item.balance : finalBalance;
                    }
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-900/50 transition-colors";
                    tr.innerHTML = `
                        <td class="py-3.5 px-6 font-semibold text-emerald-400">${m.label}</td>
                        <td class="py-3.5 px-6 font-medium text-white">${m.day}</td>
                        <td class="py-3.5 px-6 font-semibold text-white">$${interestAt.toFixed(2)}</td>
                        <td class="py-3.5 px-6 font-semibold text-emerald-300">${fmtUSD(balanceAt)}</td>`;
                    tbody.appendChild(tr);
                });
            }

            renderTable(ledger) {
                const tbody = this.el.ledgerTableBody;
                const showW = this.tab === 'withdrawal';
                tbody.innerHTML = '';
                ledger.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-900/50 transition-colors";
                    const wd = showW
                        ? `<td class="py-3.5 px-6 ${row.withdrawn > 0 ? 'text-amber-400 font-semibold' : 'text-slate-600'}">${row.withdrawn > 0 ? '-' + fmtUSD(row.withdrawn) : '—'}</td>` : '';
                    tr.innerHTML = `
                        <td class="py-3.5 px-6 font-medium text-white">${row.day}</td>
                        <td class="py-3.5 px-6 text-slate-300">${fmtUSD(row.totalInterest)}</td>
                        <td class="py-3.5 px-6 font-semibold text-white">${fmtUSD(row.balance)}</td>
                        <td class="py-3.5 px-6 text-emerald-400">${fmtUSD(row.dailyInterest)}</td>${wd}`;
                    tbody.appendChild(tr);
                });
            }

            renderChart(labels, data) {
                const ctx = this.el.growthChart.getContext('2d');
                const gradient = ctx.createLinearGradient(0, 0, 0, 320);
                gradient.addColorStop(0, 'rgba(16, 185, 129, 0.35)');
                gradient.addColorStop(1, 'rgba(16, 185, 129, 0.0)');

                if (this.chart) {
                    this.chart.data.labels = labels;
                    this.chart.data.datasets[0].data = data;
                    this.chart.data.datasets[0].backgroundColor = gradient;
                    this.chart.update();
                    return;
                }
                this.chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [{
                            label: 'Compounded Balance ($)', data,
                            borderColor: '#34d399', backgroundColor: gradient, borderWidth: 2, fill: true,
                            tension: 0.3, cubicInterpolationMode: 'monotone',
                            pointRadius: 3, pointBackgroundColor: '#34d399', pointBorderColor: '#0f172a', pointBorderWidth: 1.5,
                            pointHoverRadius: 5, pointHoverBackgroundColor: '#10b981', pointHoverBorderColor: '#ffffff', pointHoverBorderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false, animation: { duration: 300 },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: '#020617', titleColor: '#ffffff', bodyColor: '#34d399',
                                borderColor: '#334155', borderWidth: 1.5, padding: 12, displayColors: false,
                                callbacks: { label: c => 'Balance: ' + fmtUSD(c.parsed.y) }
                            }
                        },
                        scales: {
                            x: { grid: { color: 'rgba(51, 65, 85, 0.4)' }, ticks: { color: '#94a3b8', font: { family: 'Inter', size: 12, weight: '500' } } },
                            y: {
                                grid: { color: 'rgba(51, 65, 85, 0.4)' },
                                ticks: { color: '#94a3b8', font: { family: 'Inter', size: 12, weight: '500' }, callback: v => '$' + v.toLocaleString() }
                            }
                        }
                    }
                });
            }

            // ---------- Klar calculator ----------
            calculateYields() {
                const e = this.el;
                const principal = parseFloat(e.initialBalance.value) || 0;
                const duration = parseInt(e.timeDuration.value) || 1;
                const unit = e.timeUnit.value;
                const r1 = (parseFloat(e.tier1Rate.value) || 15.0) / 100;
                const r2 = (parseFloat(e.tier2Rate.value) || 8.0) / 100;

                e.tier1RateDisplay.innerText = `${(r1 * 100).toFixed(1)}% APY`;
                e.tier2RateDisplay.innerText = `${(r2 * 100).toFixed(1)}% APY`;

                let totalDays = duration;
                if (unit === 'weeks') totalDays = duration * 7;
                if (unit === 'months') totalDays = Math.round(duration * 30.4375);
                if (unit === 'years') totalDays = Math.round(duration * 365);

                const p1 = Math.min(principal, TIER_1_CAP);
                const p2 = Math.max(0, principal - TIER_1_CAP);
                const blendedApy = principal > 0 ? ((p1 * r1) + (p2 * r2)) / principal : 0;

                let cP1 = p1, cP2 = p2, t1Int = 0, t2Int = 0;
                for (let day = 1; day <= totalDays; day++) {
                    const d1 = r1 / 365, d2 = r2 / 365;
                    t1Int += cP1 * d1;
                    t2Int += cP2 * d2;
                    if (this.weekly && day % 7 === 0) {
                        const w1 = (cP1 * Math.pow(1 + d1, 7)) - cP1;
                        const w2 = (cP2 * Math.pow(1 + d2, 7)) - cP2;
                        const newTotal = cP1 + cP2 + w1 + w2;
                        cP1 = Math.min(newTotal, TIER_1_CAP);
                        cP2 = Math.max(0, newTotal - TIER_1_CAP);
                    }
                }

                const totalInterest = t1Int + t2Int;
                const finalBalance = principal + totalInterest;
                const retPct = principal > 0 ? (totalInterest / principal) * 100 : 0;

                e.kpiFinalBalance.textContent = fmtMXN(finalBalance);
                e.kpiTotalInterest.textContent = `+${fmtMXN(totalInterest)}`;
                e.kpiPercentReturn.innerHTML = `<i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i> +${retPct.toFixed(2)}% return over ${duration} ${unit}`;
                e.kpiEffectiveApy.textContent = `${(blendedApy * 100).toFixed(2)}%`;
                e.kpiPrincipalNote.innerHTML = `<i data-lucide="wallet" class="w-3.5 h-3.5"></i> Initial Principal: ${fmtMXN(principal)}`;

                const t1Pct = principal > 0 ? Math.min(100, (p1 / principal) * 100) : 0;
                const t2Pct = 100 - t1Pct;
                e.tier1Bar.style.width = `${t1Pct}%`;
                e.tier2Bar.style.width = `${t2Pct}%`;
                e.tier1Amount.textContent = fmtMXN(p1);
                e.tier2Amount.textContent = fmtMXN(p2);
                e.tier1Earnings.textContent = fmtMXN(t1Int);
                e.tier2Earnings.textContent = fmtMXN(t2Int);

                if (p2 > 0) {
                    e.tierSplitBadge.textContent = `${t1Pct.toFixed(0)}% T1 / ${t2Pct.toFixed(0)}% T2`;
                    e.tierSplitBadge.className = "text-xs text-indigo-400 font-semibold";
                } else {
                    e.tierSplitBadge.textContent = "100% in Tier 1 (15%)";
                    e.tierSplitBadge.className = "text-xs text-brand-400 font-semibold";
                }

                const dailyEst = (p1 * (r1 / 365)) + (p2 * (r2 / 365));
                e.tableDaily.textContent = fmtMXN(dailyEst);
                e.tableWeekly.textContent = fmtMXN(dailyEst * 7);
                e.tableMonthly.textContent = fmtMXN(dailyEst * 30.4375);
                e.tableAnnual.textContent = fmtMXN((p1 * r1) + (p2 * r2));

                if (window.lucide) lucide.createIcons();
                alignPanes();
            }

            setWeekly(on) {
                this.weekly = on;
                this.el.compoundWeeklyBtn.className = on
                    ? "py-2 text-xs font-semibold rounded-lg bg-brand-600 text-white shadow transition"
                    : "py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition";
                this.el.compoundSimpleBtn.className = on
                    ? "py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition"
                    : "py-2 text-xs font-semibold rounded-lg bg-brand-600 text-white shadow transition";
                this.calculateYields();
            }

            bind() {
                const e = this.el;
                ['initialInvestment', 'annualRate', 'recurringAmount', 'recurringDays'].forEach(k =>
                    e[k].addEventListener('input', () => this.calculate()));

                // Quick adjust buttons (Initial Investment min 1, Withdrawal amount min 0)
                this.root.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => {
                    const inp = e[b.dataset.target];
                    const floor = b.dataset.target === 'initialInvestment' ? 1 : 0;
                    const cur = parseFloat(inp.value) || 0;
                    inp.value = Math.max(floor, Math.round((cur + parseFloat(b.dataset.step)) * 100) / 100);
                    this.calculate();
                }));

                e.initialBalance.addEventListener('input', ev => { e.initialBalanceSlider.value = ev.target.value; this.calculateYields(); });
                e.initialBalanceSlider.addEventListener('input', ev => { e.initialBalance.value = ev.target.value; this.calculateYields(); });
                e.timeDuration.addEventListener('input', () => this.calculateYields());
                e.timeUnit.addEventListener('change', () => this.calculateYields());
                e.tier1Rate.addEventListener('input', () => this.calculateYields());
                e.tier2Rate.addEventListener('input', () => this.calculateYields());
                e.compoundWeeklyBtn.addEventListener('click', () => this.setWeekly(true));
                e.compoundSimpleBtn.addEventListener('click', () => this.setWeekly(false));

                e.toggleRatesBtn.addEventListener('click', () => {
                    const hidden = e.ratesPanel.classList.toggle('hidden');
                    e.ratesChevron.classList.toggle('rotate-180', !hidden);
                });

                e.resetBtn.addEventListener('click', () => {
                    e.initialBalance.value = 25000;
                    e.initialBalanceSlider.value = 25000;
                    e.timeDuration.value = 12;
                    e.timeUnit.value = 'months';
                    e.tier1Rate.value = 15.0;
                    e.tier2Rate.value = 8.0;
                    this.setWeekly(true);
                });
            }
        }

        // ---------- Layout (single / side by side) ----------
        const headerTabs = document.getElementById('headerTabs');
        const panesEl = document.getElementById('panes');
        const paneA = new Pane('A', 'monthly', headerTabs);
        const paneB = new Pane('B', 'recurring', null);
        panesEl.appendChild(paneA.root);
        panesEl.appendChild(paneB.root);

        const LAYOUT_ON = "px-3 py-2 rounded-lg transition-all whitespace-nowrap bg-emerald-600 text-white shadow";
        const LAYOUT_OFF = "px-3 py-2 rounded-lg transition-all whitespace-nowrap text-slate-400 hover:text-white";

        // In side-by-side mode, push the shorter view's "Milestone Progress Breakdown" down
        // so both milestone sections start at the same height.
        function alignPanes() {
            const secs = [paneA, paneB].map(p => p.el.milestoneSection);
            secs.forEach(sec => { sec.style.paddingTop = ''; });
            if (!document.body.classList.contains('split') || window.innerWidth < 1024) return;
            if ([paneA, paneB].some(p => p.tab === 'klar_flex')) return;
            const diff = secs[0].getBoundingClientRect().top - secs[1].getBoundingClientRect().top;
            if (Math.abs(diff) < 1) return;
            (diff > 0 ? secs[1] : secs[0]).style.paddingTop = Math.abs(diff) + 'px';
        }
        window.addEventListener('resize', alignPanes);

        function applyLayout(mode) {
            const split = mode === 'split';
            document.body.classList.toggle('split', split);
            document.body.classList.toggle('single', !split);
            paneB.root.classList.toggle('hidden', !split);
            headerTabs.classList.toggle('hidden', split);
            paneA.el.paneTabs.classList.toggle('hidden', !split);
            document.getElementById('layoutSingle').className = split ? LAYOUT_OFF : LAYOUT_ON;
            document.getElementById('layoutSplit').className = split ? LAYOUT_ON : LAYOUT_OFF;
            alignPanes();
            requestAnimationFrame(() => { [paneA, paneB].forEach(p => p.chart && p.chart.resize()); alignPanes(); });
        }

        document.getElementById('layoutSingle').addEventListener('click', () => applyLayout('single'));
        document.getElementById('layoutSplit').addEventListener('click', () => applyLayout('split'));

        window.onload = function () {
            paneA.setTab('monthly');
            paneB.setTab('recurring');
            applyLayout('single');
            if (window.lucide) lucide.createIcons();
            setTimeout(alignPanes, 150);
        };
    </script>
</body>
</html>
